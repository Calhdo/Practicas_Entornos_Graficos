<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Práctica 3 - Componentes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .bg-verde {
      background-color: #28a745;
      min-height: 80px;
    }

    .bg-sidebar {
      background-color: #f8f9fa;
      min-height: 400px;
      border: 1px solid #dee2e6;
    }

    .bg-celeste {
      background-color: #17a2b8;
      min-height: 200px;
    }
  </style>
</head>

<body>

  <div class="container my-4">
    <div class="row g-3">

      <div class="col-12">
        <div class="p-3 bg-verde rounded">
          <div class="alert alert-success m-0" role="alert">
            ¡Operación realizada con éxito! Esta es la alerta solicitada.
          </div>
        </div>
      </div>

      <div class="col-12 col-md-3">
        <div class="p-3 bg-sidebar rounded text-center">
          <h5>Sidebar</h5>
          <button type="button" class="btn btn-primary mt-3" data-bs-toggle="modal" data-bs-target="#modalEjemplo">
            Abrir Ventana Modal
          </button>
        </div>
      </div>

      <div class="col-12 col-md-9">
        <div class="row g-3">

          <div class="col-12 col-md-3">
            <div class="card h-100">
              <img src="https://via.placeholder.com/300x180" class="card-img-top" alt="Imagen Cualquiera">
              <div class="card-body">
                <h5 class="card-title">Título</h5>
                <p class="card-text">Texto descriptivo</p>
                <a href="#" class="btn btn-primary">Link</a>
              </div>
            </div>
          </div>
          <div class="col-12 col-md-3">
            <div class="card h-100">
              <img src="https://via.placeholder.com/300x180" class="card-img-top" alt="Imagen Cualquiera">
              <div class="card-body">
                <h5 class="card-title">Título</h5>
                <p class="card-text">Texto descriptivo</p>
                <a href="#" class="btn btn-primary">Link</a>
              </div>
            </div>
          </div>
          <div class="col-12 col-md-3">
            <div class="card h-100">
              <img src="https://via.placeholder.com/300x180" class="card-img-top" alt="Imagen Cualquiera">
              <div class="card-body">
                <h5 class="card-title">Título</h5>
                <p class="card-text">Texto descriptivo</p>
                <a href="#" class="btn btn-primary">Link</a>
              </div>
            </div>
          </div>
          <div class="col-12 col-md-3">
            <div class="card h-100">
              <img src="https://via.placeholder.com/300x180" class="card-img-top" alt="Imagen Cualquiera">
              <div class="card-body">
                <h5 class="card-title">Título</h5>
                <p class="card-text">Texto descriptivo</p>
                <a href="#" class="btn btn-primary">Link</a>
              </div>
            </div>
          </div>

          <div class="col-12 col-md-6 offset-md-6">
            <div class="p-2 bg-celeste rounded">
              <div id="sliderComponente" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner rounded">
                  <div class="carousel-item active">
                    <img src="https://via.placeholder.com/600x250/17a2b8/ffffff?text=Imagen+1" class="d-block w-100"
                      alt="Slide 1">
                  </div>
                  <div class="carousel-item">
                    <img src="https://via.placeholder.com/600x250/007bff/ffffff?text=Imagen+2" class="d-block w-100"
                      alt="Slide 2">
                  </div>
                  <div class="carousel-item">
                    <img src="https://via.placeholder.com/600x250/6c757d/ffffff?text=Imagen+3" class="d-block w-100"
                      alt="Slide 3">
                  </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#sliderComponente"
                  data-bs-slide="prev">
                  <span class="carousel-control-prev-icon"></span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#sliderComponente"
                  data-bs-slide="next">
                  <span class="carousel-control-next-icon"></span>
                </button>
              </div>
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>

  <div class="modal fade" id="modalEjemplo" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalLabel">Título del Modal</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          Este es el contenido desplegable del modal.
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          <button type="button" class="btn btn-primary">Guardar cambios</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
